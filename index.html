<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma galerie 3D — Le parc</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; position: relative; }
  #info-panel {
    position: absolute; top: 16px; left: 16px;
    background: rgba(0,0,0,0.65); color: white;
    padding: 14px 18px; border-radius: 10px;
    font-size: 13px; z-index: 10; pointer-events: none;
    max-width: 300px; line-height: 1.6;
    backdrop-filter: blur(4px);
  }
  #info-panel .title { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
  #title-overlay {
    position: absolute; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8); color: white;
    padding: 10px 20px; border-radius: 8px;
    font-size: 14px; z-index: 10; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
  #door-overlay {
    position: absolute; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,200,100,0.95); color: #2a1810;
    padding: 12px 24px; border-radius: 8px;
    font-size: 14px; font-weight: 600; z-index: 10; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
    box-shadow: 0 4px 20px rgba(255,180,80,0.5);
  }
  #start-screen {
    position: absolute; inset: 0; z-index: 20;
    background: radial-gradient(circle at center, rgba(40,20,10,0.85), rgba(0,0,0,0.95));
    display: flex; align-items: center; justify-content: center;
    color: white; text-align: center; cursor: pointer;
  }
  #start-screen.hidden { display: none; }
  #start-screen h1 { font-size: 32px; margin-bottom: 16px; font-weight: 300; letter-spacing: 2px; }
  #start-screen p { font-size: 15px; opacity: 0.85; margin-bottom: 6px; }
  #start-screen .cta { margin-top: 28px; padding: 14px 32px; border: 1px solid white; border-radius: 6px; display: inline-block; font-size: 14px; }
  #fade-overlay {
    position: absolute; inset: 0; z-index: 30;
    background: black; opacity: 0; pointer-events: none;
    transition: opacity 0.6s;
  }
  #fade-overlay.active { opacity: 1; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="info-panel">
  <div class="title">🌳 Le parc</div>
  <div>ZQSD ou WASD pour se déplacer</div>
  <div>Souris pour regarder</div>
  <div>Échap pour libérer la souris</div>
  <div style="margin-top: 8px; opacity: 0.8; font-size: 12px;">Approche-toi des portes pour entrer</div>
</div>
<div id="title-overlay"></div>
<div id="door-overlay"></div>
<div id="fade-overlay"></div>
<div id="start-screen">
  <div>
    <h1>Bienvenue dans ma galerie</h1>
    <p>Tu arrives dans un petit parc</p>
    <p>Deux maisons abritent mes photos</p>
    <div class="cta">Cliquer pour entrer</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// PHOTOS DU PARC (sur les murs en brique)
// Mets tes photos dans photos/parc/
// ============================================================
const PHOTOS_PARC = [
  { src: 'photos/parc/photo1.jpg', titre: 'Photo 1' },
  { src: 'photos/parc/photo2.jpg', titre: 'Photo 2' },
  { src: 'photos/parc/photo3.jpg', titre: 'Photo 3' },
  { src: 'photos/parc/photo4.jpg', titre: 'Photo 4' },
  { src: 'photos/parc/photo5.jpg', titre: 'Photo 5' },
  { src: 'photos/parc/photo6.jpg', titre: 'Photo 6' },
];
// ============================================================

(function() {
  const container = document.getElementById('canvas-container');
  const titleOverlay = document.getElementById('title-overlay');
  const doorOverlay = document.getElementById('door-overlay');
  const startScreen = document.getElementById('start-screen');
  const fadeOverlay = document.getElementById('fade-overlay');

  const scene = new THREE.Scene();
  // Ciel doré de fin de journée
  scene.background = new THREE.Color(0xf4a87a);
  scene.fog = new THREE.Fog(0xf4a87a, 15, 60);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
  camera.position.set(0, 1.7, 12);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  container.appendChild(renderer.domElement);

  // === ÉCLAIRAGE GOLDEN HOUR ===
  const ambient = new THREE.AmbientLight(0xffd4a0, 0.6);
  scene.add(ambient);

  // Soleil bas (lumière dorée)
  const sun = new THREE.DirectionalLight(0xffb060, 1.4);
  sun.position.set(-30, 8, -10);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.left = -30;
  sun.shadow.camera.right = 30;
  sun.shadow.camera.top = 30;
  sun.shadow.camera.bottom = -30;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 80;
  scene.add(sun);

  // Lumière de remplissage bleutée (ciel)
  const skyLight = new THREE.HemisphereLight(0xffd4a0, 0x6b4b2a, 0.4);
  scene.add(skyLight);

  // === TEXTURES PROCÉDURALES ===
  function makeBrickTexture(baseColor = '#8b4a2b', mortarColor = '#3a2820') {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = mortarColor;
    ctx.fillRect(0, 0, 512, 512);
    const bw = 64, bh = 24;
    for (let y = 0; y < 512; y += bh) {
      const offset = (Math.floor(y / bh) % 2) * (bw / 2);
      for (let x = -bw; x < 512; x += bw) {
        const r = parseInt(baseColor.slice(1,3), 16) + (Math.random()-0.5) * 40;
        const g = parseInt(baseColor.slice(3,5), 16) + (Math.random()-0.5) * 25;
        const b = parseInt(baseColor.slice(5,7), 16) + (Math.random()-0.5) * 20;
        ctx.fillStyle = `rgb(${Math.max(0,Math.min(255,r))|0},${Math.max(0,Math.min(255,g))|0},${Math.max(0,Math.min(255,b))|0})`;
        ctx.fillRect(x + offset + 1, y + 1, bw - 2, bh - 2);
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(x + offset, y, 1, bh);
        ctx.fillRect(x + offset, y, bw, 1);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  function makeGrassTexture() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#4a6028';
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 15000; i++) {
      const r = 60 + Math.random() * 60;
      const g = 80 + Math.random() * 60;
      const b = 30 + Math.random() * 40;
      ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${Math.random()*0.7+0.3})`;
      ctx.fillRect(Math.random()*512, Math.random()*512, 1+Math.random()*2, 2+Math.random()*4);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  function makePathTexture() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#a08060';
    ctx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 3000; i++) {
      const v = 120 + Math.random() * 60;
      ctx.fillStyle = `rgba(${v|0},${(v-20)|0},${(v-40)|0},${Math.random()*0.5})`;
      ctx.fillRect(Math.random()*256, Math.random()*256, 1+Math.random()*3, 1+Math.random()*3);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  function makePlaceholderTexture(idx) {
    const palettes = [
      ['#d4654a', '#f4a261', '#e9c46a', '#264653'],
      ['#2a9d8f', '#264653', '#e76f51', '#f4a261'],
      ['#6a994e', '#a7c957', '#f2e8cf', '#bc4749'],
      ['#003049', '#d62828', '#f77f00', '#fcbf49'],
      ['#7209b7', '#3a0ca3', '#4361ee', '#4cc9f0'],
      ['#1d3557', '#457b9d', '#a8dadc', '#f1faee'],
    ];
    const p = palettes[idx % palettes.length];
    const c = document.createElement('canvas');
    c.width = 400; c.height = 500;
    const ctx = c.getContext('2d');
    ctx.fillStyle = p[0];
    ctx.fillRect(0, 0, 400, 500);
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = p[(i+1) % p.length];
      ctx.globalAlpha = 0.7 + Math.random()*0.3;
      ctx.beginPath();
      ctx.arc(Math.random()*400, Math.random()*500, 50 + Math.random()*120, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Photo ' + (idx+1), 200, 260);
    return new THREE.CanvasTexture(c);
  }

  function loadPhotoTexture(src, idx) {
    const placeholder = makePlaceholderTexture(idx);
    const mat = new THREE.MeshStandardMaterial({
      map: placeholder, roughness: 0.4,
      emissive: 0x332211, emissiveIntensity: 0.1
    });
    new THREE.TextureLoader().load(src,
      (tex) => { mat.map = tex; mat.needsUpdate = true; },
      undefined, () => {}
    );
    return mat;
  }

  // === SOL DU PARC ===
  const PARK_SIZE = 30;
  const grassTex = makeGrassTexture();
  grassTex.repeat.set(8, 8);
  const grass = new THREE.Mesh(
    new THREE.PlaneGeometry(PARK_SIZE * 2, PARK_SIZE * 2),
    new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.95 })
  );
  grass.rotation.x = -Math.PI / 2;
  grass.receiveShadow = true;
  scene.add(grass);

  // Allée centrale
  const pathTex = makePathTexture();
  pathTex.repeat.set(2, 8);
  const path = new THREE.Mesh(
    new THREE.PlaneGeometry(3, 28),
    new THREE.MeshStandardMaterial({ map: pathTex, roughness: 0.9 })
  );
  path.rotation.x = -Math.PI / 2;
  path.position.y = 0.01;
  path.receiveShadow = true;
  scene.add(path);

  // Allée transversale
  const path2 = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 3),
    new THREE.MeshStandardMaterial({ map: pathTex, roughness: 0.9 })
  );
  path2.rotation.x = -Math.PI / 2;
  path2.position.y = 0.01;
  path2.receiveShadow = true;
  scene.add(path2);

  // === MURS EN BRIQUE (3 côtés) ===
  const brickTex = makeBrickTexture();
  brickTex.repeat.set(6, 2);
  const brickMat = new THREE.MeshStandardMaterial({ map: brickTex, roughness: 0.95 });

  const WALL_H = 4;
  const WALL_LEN = 30;

  // Mur arrière (nord)
  const wallBack = new THREE.Mesh(new THREE.BoxGeometry(WALL_LEN, WALL_H, 0.4), brickMat);
  wallBack.position.set(0, WALL_H/2, -WALL_LEN/2);
  wallBack.castShadow = true;
  wallBack.receiveShadow = true;
  scene.add(wallBack);

  // Mur gauche (ouest)
  const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.4, WALL_H, WALL_LEN), brickMat);
  wallLeft.position.set(-WALL_LEN/2, WALL_H/2, 0);
  wallLeft.castShadow = true;
  wallLeft.receiveShadow = true;
  scene.add(wallLeft);

  // Mur droit (est)
  const wallRight = new THREE.Mesh(new THREE.BoxGeometry(0.4, WALL_H, WALL_LEN), brickMat);
  wallRight.position.set(WALL_LEN/2, WALL_H/2, 0);
  wallRight.castShadow = true;
  wallRight.receiveShadow = true;
  scene.add(wallRight);

  // Couvre-mur en pierre claire
  const capMat = new THREE.MeshStandardMaterial({ color: 0xc4a878, roughness: 0.7 });
  [
    [0, WALL_H + 0.1, -WALL_LEN/2, WALL_LEN, 0.6],
    [-WALL_LEN/2, WALL_H + 0.1, 0, 0.6, WALL_LEN],
    [WALL_LEN/2, WALL_H + 0.1, 0, 0.6, WALL_LEN],
  ].forEach(([x,y,z,w,d]) => {
    const cap = new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, d), capMat);
    cap.position.set(x, y, z);
    scene.add(cap);
  });

  // === GRILLE (côté sud, donnant sur la rue) ===
  const fenceMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.7, roughness: 0.4 });
  const FENCE_Z = WALL_LEN/2;

  // Base en pierre
  const fenceBase = new THREE.Mesh(new THREE.BoxGeometry(WALL_LEN, 0.6, 0.3), capMat);
  fenceBase.position.set(0, 0.3, FENCE_Z);
  scene.add(fenceBase);

  // Barreaux verticaux
  for (let x = -WALL_LEN/2 + 0.5; x <= WALL_LEN/2 - 0.5; x += 0.4) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.06, 2.4, 0.06), fenceMat);
    bar.position.set(x, 1.8, FENCE_Z);
    scene.add(bar);
    // Pointes
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.15, 4), fenceMat);
    tip.position.set(x, 3.05, FENCE_Z);
    scene.add(tip);
  }
  // Barre horizontale haute et basse
  for (const y of [0.8, 2.8]) {
    const hbar = new THREE.Mesh(new THREE.BoxGeometry(WALL_LEN, 0.08, 0.08), fenceMat);
    hbar.position.set(0, y, FENCE_Z);
    scene.add(hbar);
  }
  // Piliers aux extrémités
  for (const x of [-WALL_LEN/2, WALL_LEN/2]) {
    const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.6, WALL_H, 0.6), brickMat);
    pillar.position.set(x, WALL_H/2, FENCE_Z);
    pillar.castShadow = true;
    scene.add(pillar);
  }

  // === RUE DE L'AUTRE CÔTÉ ===
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x3a3a38, roughness: 0.85 });
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(WALL_LEN + 4, 6),
    roadMat
  );
  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0.005, FENCE_Z + 4);
  road.receiveShadow = true;
  scene.add(road);

  // Trottoir
  const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x9a9692, roughness: 0.9 });
  const sidewalk = new THREE.Mesh(
    new THREE.BoxGeometry(WALL_LEN + 4, 0.15, 1.5),
    sidewalkMat
  );
  sidewalk.position.set(0, 0.075, FENCE_Z + 0.9);
  scene.add(sidewalk);

  // Ligne blanche au milieu de la rue
  for (let x = -WALL_LEN/2; x < WALL_LEN/2; x += 2) {
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 0.15),
      new THREE.MeshStandardMaterial({ color: 0xeeeeee })
    );
    line.rotation.x = -Math.PI / 2;
    line.position.set(x + 1, 0.01, FENCE_Z + 4);
    scene.add(line);
  }

  // Trottoir d'en face + bâtiments lointains (silhouettes)
  const farSidewalk = new THREE.Mesh(
    new THREE.BoxGeometry(WALL_LEN + 4, 0.15, 1.5),
    sidewalkMat
  );
  farSidewalk.position.set(0, 0.075, FENCE_Z + 7.5);
  scene.add(farSidewalk);

  // Bâtiments en arrière-plan
  for (let x = -WALL_LEN/2; x < WALL_LEN/2; x += 4 + Math.random() * 2) {
    const h = 6 + Math.random() * 8;
    const w = 3 + Math.random() * 2;
    const colors = [0xb88a5a, 0x9a6a4a, 0xa07555, 0xc69870];
    const building = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, 3),
      new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random()*colors.length)], roughness: 0.9 })
    );
    building.position.set(x, h/2, FENCE_Z + 10);
    building.castShadow = true;
    scene.add(building);

    // Fenêtres éclairées
    for (let fy = 1.5; fy < h - 1; fy += 1.5) {
      for (let fx = -w/2 + 0.5; fx < w/2 - 0.3; fx += 1) {
        if (Math.random() > 0.3) {
          const window = new THREE.Mesh(
            new THREE.PlaneGeometry(0.4, 0.6),
            new THREE.MeshStandardMaterial({
              color: 0xffd88a,
              emissive: 0xffaa55,
              emissiveIntensity: Math.random() > 0.5 ? 0.6 : 0.2
            })
          );
          window.position.set(x + fx, fy, FENCE_Z + 10 - 1.51);
          scene.add(window);
        }
      }
    }
  }

  // === DEUX MAISONS (les portes vers les salles) ===
  const doors = []; // pour la détection de collision

  function makeHouse(x, z, label, targetUrl, accentColor) {
    const group = new THREE.Group();
    group.position.set(x, 0, z);

    const HOUSE_W = 5, HOUSE_D = 4, HOUSE_H = 3.5;

    // Murs de la maison
    const houseMat = new THREE.MeshStandardMaterial({
      map: makeBrickTexture('#a87050', '#4a3020'),
      roughness: 0.9
    });
    houseMat.map.repeat.set(2, 1);

    // Façade avec ouverture pour la porte
    const doorW = 1.4, doorH = 2.4;
    // Murs façade : gauche et droit de la porte + linteau
    const facadeLeft = new THREE.Mesh(
      new THREE.BoxGeometry((HOUSE_W - doorW) / 2, HOUSE_H, 0.3),
      houseMat
    );
    facadeLeft.position.set(-(HOUSE_W + doorW) / 4, HOUSE_H/2, HOUSE_D/2);
    facadeLeft.castShadow = true;
    facadeLeft.receiveShadow = true;
    group.add(facadeLeft);

    const facadeRight = new THREE.Mesh(
      new THREE.BoxGeometry((HOUSE_W - doorW) / 2, HOUSE_H, 0.3),
      houseMat
    );
    facadeRight.position.set((HOUSE_W + doorW) / 4, HOUSE_H/2, HOUSE_D/2);
    facadeRight.castShadow = true;
    facadeRight.receiveShadow = true;
    group.add(facadeRight);

    const lintel = new THREE.Mesh(
      new THREE.BoxGeometry(doorW, HOUSE_H - doorH, 0.3),
      houseMat
    );
    lintel.position.set(0, doorH + (HOUSE_H - doorH)/2, HOUSE_D/2);
    lintel.castShadow = true;
    group.add(lintel);

    // Autres murs
    const wallBack2 = new THREE.Mesh(new THREE.BoxGeometry(HOUSE_W, HOUSE_H, 0.3), houseMat);
    wallBack2.position.set(0, HOUSE_H/2, -HOUSE_D/2);
    wallBack2.castShadow = true;
    group.add(wallBack2);

    const wallLeft2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, HOUSE_H, HOUSE_D), houseMat);
    wallLeft2.position.set(-HOUSE_W/2, HOUSE_H/2, 0);
    wallLeft2.castShadow = true;
    group.add(wallLeft2);

    const wallRight2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, HOUSE_H, HOUSE_D), houseMat);
    wallRight2.position.set(HOUSE_W/2, HOUSE_H/2, 0);
    wallRight2.castShadow = true;
    group.add(wallRight2);

    // Toit en pente
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x4a2a1a, roughness: 0.8 });
    const roofGeo = new THREE.ConeGeometry(HOUSE_W * 0.75, 1.5, 4);
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.set(0, HOUSE_H + 0.75, 0);
    roof.rotation.y = Math.PI / 4;
    roof.scale.set(1, 1, HOUSE_D / HOUSE_W);
    roof.castShadow = true;
    group.add(roof);

    // Encadrement de porte (couleur accent)
    const frameMat = new THREE.MeshStandardMaterial({ color: accentColor, roughness: 0.6 });
    [
      [-doorW/2 - 0.05, doorH/2, HOUSE_D/2 + 0.01, 0.1, doorH, 0.1],
      [doorW/2 + 0.05, doorH/2, HOUSE_D/2 + 0.01, 0.1, doorH, 0.1],
      [0, doorH + 0.05, HOUSE_D/2 + 0.01, doorW + 0.2, 0.1, 0.1],
    ].forEach(([fx,fy,fz,fw,fh,fd]) => {
      const frame = new THREE.Mesh(new THREE.BoxGeometry(fw, fh, fd), frameMat);
      frame.position.set(fx, fy, fz);
      group.add(frame);
    });

    // Lueur dorée à l'intérieur (porte ouverte)
    const glow = new THREE.Mesh(
      new THREE.PlaneGeometry(doorW, doorH),
      new THREE.MeshBasicMaterial({
        color: 0xffd28a,
        transparent: true,
        opacity: 0.6
      })
    );
    glow.position.set(0, doorH/2, HOUSE_D/2 - 0.05);
    group.add(glow);

    // Lampe au-dessus de la porte
    const lampShade = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.25, 0.3, 8),
      new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.5 })
    );
    lampShade.position.set(0, doorH + 0.6, HOUSE_D/2 + 0.3);
    group.add(lampShade);

    const lampLight = new THREE.PointLight(0xffaa55, 1.2, 5, 2);
    lampLight.position.set(0, doorH + 0.4, HOUSE_D/2 + 0.3);
    group.add(lampLight);

    // Panneau avec le nom de la salle
    const signCanvas = document.createElement('canvas');
    signCanvas.width = 512; signCanvas.height = 128;
    const sctx = signCanvas.getContext('2d');
    sctx.fillStyle = '#2a1810';
    sctx.fillRect(0, 0, 512, 128);
    sctx.strokeStyle = '#c4a878';
    sctx.lineWidth = 4;
    sctx.strokeRect(8, 8, 496, 112);
    sctx.fillStyle = '#f4d8a8';
    sctx.font = 'bold 48px Georgia, serif';
    sctx.textAlign = 'center';
    sctx.textBaseline = 'middle';
    sctx.fillText(label, 256, 64);
    const signTex = new THREE.CanvasTexture(signCanvas);
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 0.5),
      new THREE.MeshStandardMaterial({ map: signTex, emissive: 0x332211, emissiveIntensity: 0.3 })
    );
    sign.position.set(0, doorH + 0.55, HOUSE_D/2 + 0.16);
    group.add(sign);

    scene.add(group);

    // Zone de collision pour la porte (en coordonnées monde)
    doors.push({
      x: x,
      z: z + HOUSE_D/2 - 0.2,
      url: targetUrl,
      label: '→ Entrer dans ' + label
    });

    return group;
  }

  // Maison gauche : Salle N&B
  makeHouse(-9, -8, 'Noir & Blanc', 'salle-nb.html', 0x6a6a6a);
  // Maison droite : Salle Voyage
  makeHouse(9, -8, 'Voyages', 'salle-voyage.html', 0x4a7a8a);

  // === VÉGÉTATION ===
  function makeTree(x, z, scale = 1) {
    const group = new THREE.Group();
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a2a18, roughness: 0.95 });
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.2 * scale, 0.3 * scale, 2 * scale, 8),
      trunkMat
    );
    trunk.position.y = scale;
    trunk.castShadow = true;
    group.add(trunk);

    const leafMat = new THREE.MeshStandardMaterial({ color: 0x3a5a20, roughness: 0.9 });
    for (let i = 0; i < 5; i++) {
      const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(0.8 * scale + Math.random() * 0.4, 8, 6),
        leafMat
      );
      leaves.position.set(
        (Math.random()-0.5) * 1.2 * scale,
        2 * scale + Math.random() * 0.8 * scale,
        (Math.random()-0.5) * 1.2 * scale
      );
      leaves.castShadow = true;
      group.add(leaves);
    }
    group.position.set(x, 0, z);
    scene.add(group);
  }

  makeTree(-12, 5, 1.2);
  makeTree(12, 5, 1.0);
  makeTree(-12, -3, 0.9);
  makeTree(12, -3, 1.1);
  makeTree(-6, 8, 0.8);
  makeTree(6, 8, 0.9);
  makeTree(-13, -12, 1.0);
  makeTree(13, -12, 1.0);

  // Buissons
  function makeBush(x, z) {
    const bushMat = new THREE.MeshStandardMaterial({ color: 0x4a6028, roughness: 0.95 });
    for (let i = 0; i < 4; i++) {
      const b = new THREE.Mesh(
        new THREE.SphereGeometry(0.4 + Math.random() * 0.2, 8, 6),
        bushMat
      );
      b.position.set(x + (Math.random()-0.5) * 0.5, 0.3, z + (Math.random()-0.5) * 0.5);
      b.castShadow = true;
      scene.add(b);
    }
  }
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    makeBush(Math.cos(angle) * 8, Math.sin(angle) * 8);
  }

  // === BANC AU CENTRE ===
  const benchGroup = new THREE.Group();
  const benchWoodMat = new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 0.7 });
  const benchMetalMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.6, roughness: 0.5 });

  // Assise (3 lattes)
  for (let i = 0; i < 3; i++) {
    const slat = new THREE.Mesh(
      new THREE.BoxGeometry(2, 0.08, 0.18),
      benchWoodMat
    );
    slat.position.set(0, 0.5, -0.25 + i * 0.22);
    slat.castShadow = true;
    benchGroup.add(slat);
  }
  // Dossier
  for (let i = 0; i < 3; i++) {
    const slat = new THREE.Mesh(
      new THREE.BoxGeometry(2, 0.08, 0.15),
      benchWoodMat
    );
    slat.position.set(0, 0.85 + i * 0.18, -0.4);
    slat.rotation.x = -0.15;
    slat.castShadow = true;
    benchGroup.add(slat);
  }
  // Pieds en métal
  for (const sx of [-0.85, 0.85]) {
    const leg = new THREE.Mesh(
      new THREE.BoxGeometry(0.05, 0.5, 0.5),
      benchMetalMat
    );
    leg.position.set(sx, 0.25, -0.15);
    benchGroup.add(leg);
    const back = new THREE.Mesh(
      new THREE.BoxGeometry(0.05, 1.4, 0.05),
      benchMetalMat
    );
    back.position.set(sx, 0.7, -0.4);
    back.rotation.x = -0.15;
    benchGroup.add(back);
  }
  benchGroup.position.set(0, 0, 2);
  scene.add(benchGroup);

  // === LAMPADAIRES ===
  function makeLamp(x, z) {
    const group = new THREE.Group();
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.08, 3.5, 8),
      new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.6 })
    );
    pole.position.y = 1.75;
    pole.castShadow = true;
    group.add(pole);

    const head = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.4, 0.4),
      new THREE.MeshStandardMaterial({
        color: 0xffe0a0,
        emissive: 0xffaa55,
        emissiveIntensity: 0.8
      })
    );
    head.position.y = 3.5;
    group.add(head);

    const light = new THREE.PointLight(0xffaa55, 0.8, 8, 2);
    light.position.y = 3.4;
    group.add(light);

    group.position.set(x, 0, z);
    scene.add(group);
  }
  makeLamp(-3, 3);
  makeLamp(3, 3);
  makeLamp(-3, -3);
  makeLamp(3, -3);

  // === PHOTOS SUR LES MURS DU PARC ===
  const photoMeshes = [];
  // Réparties sur les 3 murs en brique
  const photoSpots = [
    { pos: [-10, 2.2, -WALL_LEN/2 + 0.25], rot: [0, 0, 0] },     // mur arrière gauche
    { pos: [0, 2.2, -WALL_LEN/2 + 0.25], rot: [0, 0, 0] },        // mur arrière centre
    { pos: [10, 2.2, -WALL_LEN/2 + 0.25], rot: [0, 0, 0] },       // mur arrière droite
    { pos: [-WALL_LEN/2 + 0.25, 2.2, -8], rot: [0, Math.PI/2, 0] }, // mur gauche fond
    { pos: [-WALL_LEN/2 + 0.25, 2.2, 4], rot: [0, Math.PI/2, 0] },  // mur gauche avant
    { pos: [WALL_LEN/2 - 0.25, 2.2, -8], rot: [0, -Math.PI/2, 0] }, // mur droit fond
  ];
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x2a1810, roughness: 0.6, metalness: 0.2 });

  photoSpots.forEach((p, i) => {
    if (i >= PHOTOS_PARC.length) return;
    const photoData = PHOTOS_PARC[i];
    const group = new THREE.Group();
    const pw = 1.4, ph = 1.8;
    const frame = new THREE.Mesh(new THREE.BoxGeometry(pw + 0.15, ph + 0.15, 0.08), frameMat);
    group.add(frame);
    const photoMat = loadPhotoTexture(photoData.src, i);
    const photo = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), photoMat);
    photo.position.z = 0.045;
    photo.userData = { titre: photoData.titre };
    group.add(photo);
    photoMeshes.push(photo);
    group.position.set(...p.pos);
    group.rotation.set(...p.rot);
    scene.add(group);
  });

  // === CONTRÔLES FPS ===
  const keys = {};
  let pitch = 0, yaw = 0;
  let pointerLocked = false;
  const canvas = renderer.domElement;

  function lockPointer() {
    canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
    canvas.requestPointerLock();
    startScreen.classList.add('hidden');
  }
  startScreen.addEventListener('click', lockPointer);
  canvas.addEventListener('click', lockPointer);

  document.addEventListener('pointerlockchange', () => {
    pointerLocked = document.pointerLockElement === canvas;
    if (!pointerLocked) startScreen.classList.remove('hidden');
  });

  document.addEventListener('mousemove', (e) => {
    if (!pointerLocked) return;
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, pitch));
  });

  window.addEventListener('keydown', (e) => { keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  const raycaster = new THREE.Raycaster();
  const center = new THREE.Vector2(0, 0);

  let transitioning = false;
  function transitionTo(url) {
    if (transitioning) return;
    transitioning = true;
    fadeOverlay.classList.add('active');
    setTimeout(() => { window.location.href = url; }, 600);
  }

  function updateMovement(dt) {
    const speed = 4.5;
    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const move = new THREE.Vector3();

    if (keys['KeyW'] || keys['KeyZ'] || keys['ArrowUp']) move.add(forward);
    if (keys['KeyS'] || keys['ArrowDown']) move.sub(forward);
    if (keys['KeyA'] || keys['KeyQ'] || keys['ArrowLeft']) move.sub(right);
    if (keys['KeyD'] || keys['ArrowRight']) move.add(right);

    if (move.lengthSq() > 0) {
      move.normalize().multiplyScalar(speed * dt);
      camera.position.add(move);
    }

    // Limites du parc
    const m = 1.0;
    camera.position.x = Math.max(-WALL_LEN/2 + m, Math.min(WALL_LEN/2 - m, camera.position.x));
    camera.position.z = Math.max(-WALL_LEN/2 + m, Math.min(FENCE_Z - m, camera.position.z));
    camera.position.y = 1.7;

    camera.rotation.order = 'YXZ';
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    // Détection des portes
    let nearDoor = null;
    for (const d of doors) {
      const dx = camera.position.x - d.x;
      const dz = camera.position.z - d.z;
      const dist = Math.sqrt(dx*dx + dz*dz);
      if (dist < 1.2) {
        nearDoor = d;
        if (dist < 0.6) transitionTo(d.url);
        break;
      }
    }
    if (nearDoor) {
      doorOverlay.textContent = nearDoor.label;
      doorOverlay.style.opacity = '1';
    } else {
      doorOverlay.style.opacity = '0';
    }
  }

  function checkHover() {
    raycaster.setFromCamera(center, camera);
    const hits = raycaster.intersectObjects(photoMeshes);
    if (hits.length > 0 && hits[0].distance < 4) {
      titleOverlay.textContent = hits[0].object.userData.titre;
      titleOverlay.style.opacity = '1';
    } else {
      titleOverlay.style.opacity = '0';
    }
  }

  let lastTime = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    updateMovement(dt);
    checkHover();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
