<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salle Voyage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; position: relative; }
  #info-panel {
    position: absolute; top: 16px; left: 16px;
    background: rgba(255,255,255,0.85); color: #1a1a1a;
    padding: 14px 18px; border-radius: 10px;
    font-size: 13px; z-index: 10; pointer-events: none;
    max-width: 320px; line-height: 1.6;
    backdrop-filter: blur(8px);
  }
  #info-panel .title { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
  #title-overlay {
    position: absolute; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9); color: #1a1a1a;
    padding: 10px 20px; border-radius: 8px;
    font-size: 14px; z-index: 10; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
  #exit-prompt {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(100,180,220,0.9); color: #0a1a30;
    padding: 12px 24px; border-radius: 8px;
    font-size: 15px; font-weight: 600; z-index: 10;
    pointer-events: none; opacity: 0; transition: opacity 0.2s;
  }
  #start-screen {
    position: absolute; inset: 0; z-index: 20;
    background: linear-gradient(135deg, #4a90c2 0%, #6bb1d4 100%);
    display: flex; align-items: center; justify-content: center;
    color: white; text-align: center; cursor: pointer;
  }
  #start-screen.hidden { display: none; }
  #start-screen h1 { font-size: 32px; margin-bottom: 14px; font-weight: 400; }
  #start-screen p { font-size: 15px; opacity: 0.9; margin-bottom: 6px; }
  #start-screen .cta { margin-top: 26px; padding: 12px 30px; border: 1px solid white; border-radius: 6px; display: inline-block; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="info-panel">
  <div class="title">Salle Voyage</div>
  <div>ZQSD / WASD pour se déplacer</div>
  <div>Souris pour regarder</div>
  <div>Reviens vers la sortie pour retourner au parc</div>
</div>
<div id="title-overlay"></div>
<div id="exit-prompt">← Retour au parc</div>
<div id="start-screen">
  <div>
    <h1>Salle Voyage</h1>
    <p>Une vue sur le monde</p>
    <div class="cta">Cliquer pour entrer</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="galerie-commun.js"></script>
<script>
// ============================================================
const PHOTOS_VOYAGE = [
  { src: 'photos/voyage/photo1.jpg', titre: 'Photo voyage 1' },
  { src: 'photos/voyage/photo2.jpg', titre: 'Photo voyage 2' },
  { src: 'photos/voyage/photo3.jpg', titre: 'Photo voyage 3' },
  { src: 'photos/voyage/photo4.jpg', titre: 'Photo voyage 4' },
  { src: 'photos/voyage/photo5.jpg', titre: 'Photo voyage 5' },
  { src: 'photos/voyage/photo6.jpg', titre: 'Photo voyage 6' },
];
// ============================================================

(function() {
  const container = document.getElementById('canvas-container');
  const titleOverlay = document.getElementById('title-overlay');
  const exitPrompt = document.getElementById('exit-prompt');
  const startScreen = document.getElementById('start-screen');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9bc4dc);
  scene.fog = new THREE.Fog(0xb5d3e3, 25, 80);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
  camera.position.set(0, 1.7, 7);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // === ÉCLAIRAGE LUMINEUX (jour) ===
  const ambient = new THREE.AmbientLight(0xfff5e8, 0.6);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xfff0d0, 1.0);
  sun.position.set(15, 20, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  scene.add(sun);

  const hemi = new THREE.HemisphereLight(0xa0d0ff, 0xc0a070, 0.4);
  scene.add(hemi);

  // === DIMENSIONS ===
  const ROOM_W = 18, ROOM_D = 14, ROOM_H = 5;

  // === SOL : parquet clair ===
  const woodTex = GalerieCommun.makeWoodTexture();
  woodTex.repeat.set(8, 4);
  // On éclaircit le bois pour un effet "parquet clair"
  const floorMat = new THREE.MeshStandardMaterial({
    map: woodTex,
    color: 0xc8a878,
    roughness: 0.6
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  // === MURS BLANCS LUMINEUX ===
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xf4ede0, roughness: 0.8 });

  // Mur arrière
  const wallBack = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_H), wallMat);
  wallBack.position.set(0, ROOM_H/2, -ROOM_D/2);
  wallBack.receiveShadow = true;
  scene.add(wallBack);

  // Mur avant avec porte de sortie
  const exitW = 1.4;
  const wfL = new THREE.Mesh(
    new THREE.PlaneGeometry((ROOM_W - exitW)/2, ROOM_H),
    wallMat
  );
  wfL.position.set(-(exitW/2 + (ROOM_W - exitW)/4), ROOM_H/2, ROOM_D/2);
  wfL.rotation.y = Math.PI;
  scene.add(wfL);
  const wfR = new THREE.Mesh(
    new THREE.PlaneGeometry((ROOM_W - exitW)/2, ROOM_H),
    wallMat
  );
  wfR.position.set(exitW/2 + (ROOM_W - exitW)/4, ROOM_H/2, ROOM_D/2);
  wfR.rotation.y = Math.PI;
  scene.add(wfR);
  const lintel = new THREE.Mesh(
    new THREE.PlaneGeometry(exitW, ROOM_H - 2.4),
    wallMat
  );
  lintel.position.set(0, 2.4 + (ROOM_H - 2.4)/2, ROOM_D/2);
  lintel.rotation.y = Math.PI;
  scene.add(lintel);

  // Plafond
  const ceiling = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM_W, ROOM_D),
    new THREE.MeshStandardMaterial({ color: 0xfaf5ea, roughness: 0.95 })
  );
  ceiling.rotation.x = Math.PI/2;
  ceiling.position.y = ROOM_H;
  scene.add(ceiling);

  // === BAIES VITRÉES sur les murs latéraux ===
  // À la place des murs gauche et droit pleins, on met des structures de baies vitrées
  // avec des montants verticaux et horizontaux

  function makeBayWindow(side) {
    // side = -1 pour gauche (-X), +1 pour droite (+X)
    const xPos = side * ROOM_W/2;
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.4, roughness: 0.5 });

    // Cadre extérieur
    // Haut et bas
    [0.05, ROOM_H - 0.05].forEach(y => {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, ROOM_D), frameMat);
      bar.position.set(xPos, y, 0);
      scene.add(bar);
    });
    // Coins (avant et arrière)
    [-ROOM_D/2, ROOM_D/2].forEach(z => {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.12, ROOM_H, 0.12), frameMat);
      bar.position.set(xPos, ROOM_H/2, z);
      scene.add(bar);
    });
    // Montants verticaux intermédiaires (3)
    const numV = 3;
    for (let i = 1; i <= numV; i++) {
      const z = -ROOM_D/2 + (ROOM_D / (numV + 1)) * i;
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.08, ROOM_H, 0.08), frameMat);
      bar.position.set(xPos, ROOM_H/2, z);
      scene.add(bar);
    }
    // Traverse horizontale au milieu
    const hbar = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, ROOM_D), frameMat);
    hbar.position.set(xPos, ROOM_H/2, 0);
    scene.add(hbar);

    // Vitre (transparente, légèrement bleutée)
    const glass = new THREE.Mesh(
      new THREE.PlaneGeometry(ROOM_D - 0.2, ROOM_H - 0.2),
      new THREE.MeshPhysicalMaterial({
        color: 0xddeef5,
        transparent: true,
        opacity: 0.15,
        roughness: 0.05,
        transmission: 0.9,
        side: THREE.DoubleSide
      })
    );
    glass.position.set(xPos + side * 0.01, ROOM_H/2, 0);
    glass.rotation.y = side === -1 ? Math.PI/2 : -Math.PI/2;
    scene.add(glass);
  }

  makeBayWindow(-1);
  makeBayWindow(1);

  // === PAYSAGES DERRIÈRE LES BAIES VITRÉES ===
  // Côté gauche : montagnes
  function makeMountainBackdrop(xPos, side) {
    // Sol lointain (verdure / sable)
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 50),
      new THREE.MeshStandardMaterial({ color: 0x6a8a5a, roughness: 0.95 })
    );
    ground.rotation.x = -Math.PI/2;
    ground.position.set(xPos + side * 25, 0, 0);
    scene.add(ground);

    // Montagnes en dégradé (plusieurs couches pour effet de profondeur)
    const mountainColors = [0x5a7090, 0x4a6080, 0x3a5070]; // de loin -> près
    for (let layer = 0; layer < 3; layer++) {
      const dist = 35 - layer * 8;
      const numPeaks = 6;
      for (let i = 0; i < numPeaks; i++) {
        const peakH = 8 + Math.random() * 12 - layer * 1;
        const peakW = 6 + Math.random() * 4;
        const mtn = new THREE.Mesh(
          new THREE.ConeGeometry(peakW, peakH, 4),
          new THREE.MeshStandardMaterial({ color: mountainColors[layer], roughness: 1 })
        );
        const z = -ROOM_D/2 + (ROOM_D + 10) * (i / (numPeaks - 1)) - 5;
        mtn.position.set(xPos + side * dist, peakH/2, z);
        mtn.rotation.y = Math.random() * Math.PI;
        scene.add(mtn);
      }
    }
    // Quelques arbres au premier plan
    for (let i = 0; i < 8; i++) {
      const treeMat = new THREE.MeshStandardMaterial({ color: 0x2a4a2a, roughness: 0.9 });
      const tree = new THREE.Mesh(new THREE.ConeGeometry(0.6, 2.5, 6), treeMat);
      const x = xPos + side * (4 + Math.random() * 8);
      const z = -ROOM_D/2 + Math.random() * ROOM_D;
      tree.position.set(x, 1.25, z);
      scene.add(tree);
    }
  }

  // Côté droit : plage / mer
  function makeBeachBackdrop(xPos, side) {
    // Sable
    const sand = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 40),
      new THREE.MeshStandardMaterial({ color: 0xeed8a8, roughness: 0.95 })
    );
    sand.rotation.x = -Math.PI/2;
    sand.position.set(xPos + side * 10, 0, 0);
    scene.add(sand);
    // Mer
    const sea = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({
        color: 0x4a90b8,
        roughness: 0.3,
        metalness: 0.4
      })
    );
    sea.rotation.x = -Math.PI/2;
    sea.position.set(xPos + side * 35, -0.05, 0);
    scene.add(sea);
    // Quelques palmiers
    for (let i = 0; i < 4; i++) {
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15, 0.2, 4, 8),
        new THREE.MeshStandardMaterial({ color: 0x5a3a20 })
      );
      const x = xPos + side * (3 + Math.random() * 5);
      const z = -ROOM_D/2 + Math.random() * ROOM_D;
      trunk.position.set(x, 2, z);
      scene.add(trunk);
      // Feuilles
      for (let j = 0; j < 5; j++) {
        const leaf = new THREE.Mesh(
          new THREE.SphereGeometry(0.6, 8, 4),
          new THREE.MeshStandardMaterial({ color: 0x2a6a2a })
        );
        leaf.position.set(
          x + Math.cos(j * Math.PI*2/5) * 0.6,
          4 + Math.random() * 0.3,
          z + Math.sin(j * Math.PI*2/5) * 0.6
        );
        leaf.scale.set(1.3, 0.4, 1);
        scene.add(leaf);
      }
    }
  }

  makeMountainBackdrop(-ROOM_W/2, -1);
  makeBeachBackdrop(ROOM_W/2, 1);

  // === SKYBOX ciel bleu ===
  const skyGeo = new THREE.SphereGeometry(100, 32, 16);
  function makeSkyTexture() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#4a8ac8');
    grad.addColorStop(0.5, '#7ab4dc');
    grad.addColorStop(0.85, '#c8e2f0');
    grad.addColorStop(1, '#e8f0f5');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 256, 256);
    // Quelques nuages
    for (let i = 0; i < 12; i++) {
      const x = Math.random() * 256;
      const y = 30 + Math.random() * 80;
      ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.random()*0.4})`;
      for (let j = 0; j < 5; j++) {
        ctx.beginPath();
        ctx.arc(x + j*8, y + Math.random()*5, 8 + Math.random()*5, 0, Math.PI*2);
        ctx.fill();
      }
    }
    return new THREE.CanvasTexture(c);
  }
  const sky = new THREE.Mesh(
    skyGeo,
    new THREE.MeshBasicMaterial({ map: makeSkyTexture(), side: THREE.BackSide, fog: false })
  );
  scene.add(sky);

  // === PHOTOS sur les murs avant/arrière ===
  // 6 photos : 3 sur le mur du fond, 3 répartis (mur avant gauche/droit + à hauteur des baies)
  const photoSlots = [
    { pos: [-5, 2.5, -ROOM_D/2 + 0.05], rot: [0, 0, 0] },
    { pos: [ 0, 2.5, -ROOM_D/2 + 0.05], rot: [0, 0, 0] },
    { pos: [ 5, 2.5, -ROOM_D/2 + 0.05], rot: [0, 0, 0] },
    { pos: [-5, 2.5,  ROOM_D/2 - 0.05], rot: [0, Math.PI, 0] },
    { pos: [ 5, 2.5,  ROOM_D/2 - 0.05], rot: [0, Math.PI, 0] },
    // Une au-dessus du linteau de sortie
    { pos: [ 0, 4.0,  ROOM_D/2 - 0.05], rot: [0, Math.PI, 0] },
  ];

  const photoMeshes = [];
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.6 });

  photoSlots.forEach((slot, i) => {
    const data = PHOTOS_VOYAGE[i] || { src: '', titre: 'Photo ' + (i+1) };
    const group = new THREE.Group();
    const pw = 1.6, ph = 1.2;  // photos plus paysage (16:12 environ)

    const frame = new THREE.Mesh(new THREE.BoxGeometry(pw + 0.2, ph + 0.2, 0.06), frameMat);
    group.add(frame);

    const photoMat = GalerieCommun.loadPhotoMaterial(data.src, i);
    const photo = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), photoMat);
    photo.position.z = 0.035;
    photo.userData = { titre: data.titre };
    group.add(photo);
    photoMeshes.push(photo);

    group.position.set(...slot.pos);
    group.rotation.set(...slot.rot);
    scene.add(group);
  });

  // === MOBILIER : un canapé bas et clair face au paysage ===
  const sofaMat = new THREE.MeshStandardMaterial({ color: 0xd4c8b0, roughness: 0.85 });
  const sofa = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.5, 0.9), sofaMat);
  sofa.position.set(0, 0.3, 1);
  sofa.castShadow = true;
  scene.add(sofa);
  const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.5, 0.2), sofaMat);
  sofaBack.position.set(0, 0.75, 0.65);
  scene.add(sofaBack);

  // Plante en pot
  const pot = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.25, 0.5, 16),
    new THREE.MeshStandardMaterial({ color: 0xc8a878, roughness: 0.85 })
  );
  pot.position.set(-6, 0.25, 4);
  scene.add(pot);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x4a7a3a, roughness: 0.85 });
  for (let i = 0; i < 6; i++) {
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), leafMat);
    leaf.position.set(
      -6 + (Math.random()-0.5)*0.5,
      0.7 + Math.random()*0.6,
      4 + (Math.random()-0.5)*0.5
    );
    leaf.scale.set(1, 1.6, 1);
    scene.add(leaf);
  }

  // === CONTRÔLES ===
  const ctrl = GalerieCommun.setupFPSControls(camera, renderer, {
    initialYaw: Math.PI,
    onLockChange: (locked) => {
      if (locked) startScreen.classList.add('hidden');
      else startScreen.classList.remove('hidden');
    }
  });

  startScreen.addEventListener('click', () => renderer.domElement.click());

  const checkHover = GalerieCommun.setupHoverDetection(camera, photoMeshes, titleOverlay);

  // === SORTIE ===
  const exitPos = new THREE.Vector3(0, 1.7, ROOM_D/2);
  function checkExit() {
    if (window._transitioning) return;
    const dist = camera.position.distanceTo(exitPos);
    if (dist < 1.8) {
      exitPrompt.style.opacity = '1';
      if (dist < 1.0) {
        window._transitioning = true;
        const fade = document.createElement('div');
        fade.style.cssText = 'position:fixed;inset:0;background:black;opacity:0;z-index:100;transition:opacity 0.5s';
        document.body.appendChild(fade);
        requestAnimationFrame(() => fade.style.opacity = '1');
        setTimeout(() => window.location.href = 'index.html', 550);
      }
    } else {
      exitPrompt.style.opacity = '0';
    }
  }

  function applyCollisions() {
    const m = 0.5;
    camera.position.x = Math.max(-ROOM_W/2 + m, Math.min(ROOM_W/2 - m, camera.position.x));
    const atDoor = Math.abs(camera.position.x) < exitW/2;
    if (atDoor) {
      camera.position.z = Math.max(-ROOM_D/2 + m, Math.min(ROOM_D/2 + 1.5, camera.position.z));
    } else {
      camera.position.z = Math.max(-ROOM_D/2 + m, Math.min(ROOM_D/2 - m, camera.position.z));
    }
    camera.position.y = 1.7;
  }

  // === LOOP ===
  let lastTime = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    GalerieCommun.applyMovement(camera, ctrl, dt);
    applyCollisions();
    checkHover();
    checkExit();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
