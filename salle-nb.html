<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salle Noir & Blanc</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; position: relative; }
  #info-panel {
    position: absolute; top: 16px; left: 16px;
    background: rgba(0,0,0,0.7); color: white;
    padding: 14px 18px; border-radius: 10px;
    font-size: 13px; z-index: 10; pointer-events: none;
    max-width: 320px; line-height: 1.6;
    backdrop-filter: blur(8px);
  }
  #info-panel .title { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
  #title-overlay {
    position: absolute; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8); color: white;
    padding: 10px 20px; border-radius: 8px;
    font-size: 14px; z-index: 10; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
  #exit-prompt {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,200,100,0.9); color: #1a0f00;
    padding: 12px 24px; border-radius: 8px;
    font-size: 15px; font-weight: 600; z-index: 10;
    pointer-events: none; opacity: 0; transition: opacity 0.2s;
  }
  #start-screen {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(10,10,10,0.95);
    display: flex; align-items: center; justify-content: center;
    color: white; text-align: center; cursor: pointer;
  }
  #start-screen.hidden { display: none; }
  #start-screen h1 { font-size: 30px; margin-bottom: 14px; font-weight: 300; letter-spacing: 4px; }
  #start-screen p { font-size: 15px; opacity: 0.85; margin-bottom: 6px; }
  #start-screen .cta { margin-top: 26px; padding: 12px 30px; border: 1px solid white; border-radius: 6px; display: inline-block; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="info-panel">
  <div class="title">Salle Noir & Blanc</div>
  <div>ZQSD / WASD pour se déplacer</div>
  <div>Souris pour regarder</div>
  <div>Reviens vers la sortie pour retourner au parc</div>
</div>
<div id="title-overlay"></div>
<div id="exit-prompt">← Retour au parc</div>
<div id="start-screen">
  <div>
    <h1>NOIR & BLANC</h1>
    <p>Une galerie monochrome</p>
    <div class="cta">Cliquer pour entrer</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="galerie-commun.js"></script>
<script>
// ============================================================
const PHOTOS_NB = [
  { src: 'photos/nb/photo1.jpg', titre: 'Photo N&B 1' },
  { src: 'photos/nb/photo2.jpg', titre: 'Photo N&B 2' },
  { src: 'photos/nb/photo3.jpg', titre: 'Photo N&B 3' },
  { src: 'photos/nb/photo4.jpg', titre: 'Photo N&B 4' },
  { src: 'photos/nb/photo5.jpg', titre: 'Photo N&B 5' },
  { src: 'photos/nb/photo6.jpg', titre: 'Photo N&B 6' },
  { src: 'photos/nb/photo7.jpg', titre: 'Photo N&B 7' },
  { src: 'photos/nb/photo8.jpg', titre: 'Photo N&B 8' },
];
// ============================================================

(function() {
  const container = document.getElementById('canvas-container');
  const titleOverlay = document.getElementById('title-overlay');
  const exitPrompt = document.getElementById('exit-prompt');
  const startScreen = document.getElementById('start-screen');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080808);
  scene.fog = new THREE.Fog(0x080808, 6, 25);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
  // On démarre près de l'entrée (porte côté +Z), regardant vers l'intérieur
  camera.position.set(0, 1.7, 7);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // === ÉCLAIRAGE FROID NÉONS ===
  const ambient = new THREE.AmbientLight(0xb0c0d0, 0.2);
  scene.add(ambient);

  // === DIMENSIONS ===
  const ROOM_W = 16, ROOM_D = 18, ROOM_H = 4.5;

  // === SOL : béton lisse polish ===
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a1a,
    roughness: 0.3,
    metalness: 0.4
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  // === MURS NOIRS MATS ===
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x101010, roughness: 0.95 });
  function makeWall(w, h) { return new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat); }

  const wallBack = makeWall(ROOM_W, ROOM_H);
  wallBack.position.set(0, ROOM_H/2, -ROOM_D/2);
  wallBack.receiveShadow = true;
  scene.add(wallBack);

  // Mur avant (avec une "porte" — un trou pour ressortir)
  // On fait deux pans de mur de chaque côté de la sortie
  const exitW = 1.4;
  const wallFrontL = new THREE.Mesh(
    new THREE.PlaneGeometry((ROOM_W - exitW) / 2, ROOM_H),
    wallMat
  );
  wallFrontL.position.set(-(exitW/2 + (ROOM_W - exitW)/4), ROOM_H/2, ROOM_D/2);
  wallFrontL.rotation.y = Math.PI;
  scene.add(wallFrontL);
  const wallFrontR = new THREE.Mesh(
    new THREE.PlaneGeometry((ROOM_W - exitW) / 2, ROOM_H),
    wallMat
  );
  wallFrontR.position.set(exitW/2 + (ROOM_W - exitW)/4, ROOM_H/2, ROOM_D/2);
  wallFrontR.rotation.y = Math.PI;
  scene.add(wallFrontR);
  // Linteau au-dessus de la porte
  const lintel = new THREE.Mesh(
    new THREE.PlaneGeometry(exitW, ROOM_H - 2.4),
    wallMat
  );
  lintel.position.set(0, 2.4 + (ROOM_H - 2.4)/2, ROOM_D/2);
  lintel.rotation.y = Math.PI;
  scene.add(lintel);

  const wallLeft = makeWall(ROOM_D, ROOM_H);
  wallLeft.position.set(-ROOM_W/2, ROOM_H/2, 0);
  wallLeft.rotation.y = Math.PI/2;
  wallLeft.receiveShadow = true;
  scene.add(wallLeft);

  const wallRight = makeWall(ROOM_D, ROOM_H);
  wallRight.position.set(ROOM_W/2, ROOM_H/2, 0);
  wallRight.rotation.y = -Math.PI/2;
  wallRight.receiveShadow = true;
  scene.add(wallRight);

  // Plafond noir
  const ceiling = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM_W, ROOM_D),
    new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1 })
  );
  ceiling.rotation.x = Math.PI/2;
  ceiling.position.y = ROOM_H;
  scene.add(ceiling);

  // === NÉONS AU PLAFOND ===
  function makeNeon(x, z, length = 3, color = 0xffffff) {
    const tube = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, 0.05, length),
      new THREE.MeshBasicMaterial({ color: color })
    );
    tube.position.set(x, ROOM_H - 0.15, z);
    scene.add(tube);

    // Fixation
    const mount = new THREE.Mesh(
      new THREE.BoxGeometry(0.25, 0.1, length + 0.2),
      new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.6, roughness: 0.4 })
    );
    mount.position.set(x, ROOM_H - 0.05, z);
    scene.add(mount);

    // Lumière (rectAreaLight donnerait l'effet le plus juste, mais c'est lourd)
    // On utilise plusieurs spotlights le long du néon pour simuler la diffusion
    const numLights = 3;
    for (let i = 0; i < numLights; i++) {
      const t = (i + 0.5) / numLights;
      const lz = z - length/2 + t * length;
      const spot = new THREE.SpotLight(color, 0.9, 9, Math.PI/2.5, 0.6, 1);
      spot.position.set(x, ROOM_H - 0.2, lz);
      spot.target.position.set(x, 0, lz);
      scene.add(spot);
      scene.add(spot.target);
    }
  }

  // Trois rangées de néons
  makeNeon(-4, -3, 4, 0xffffff);
  makeNeon( 0, -3, 4, 0xffffff);
  makeNeon( 4, -3, 4, 0xffffff);
  makeNeon(-4,  3, 4, 0xffffff);
  makeNeon( 0,  3, 4, 0xffffff);
  makeNeon( 4,  3, 4, 0xffffff);

  // === NÉONS COLORÉS DÉCORATIFS sur les murs (touche subtile) ===
  function makeNeonStrip(x, y, z, length, rotY, color) {
    const strip = new THREE.Mesh(
      new THREE.BoxGeometry(length, 0.06, 0.04),
      new THREE.MeshBasicMaterial({ color: color })
    );
    strip.position.set(x, y, z);
    strip.rotation.y = rotY;
    scene.add(strip);
    // Petite lumière qui éclaire le mur
    const pl = new THREE.PointLight(color, 0.5, 4, 1.8);
    pl.position.set(x, y, z);
    scene.add(pl);
  }
  // Bandeau lumineux au sol contre les murs (couleur très douce, presque blanche-bleutée)
  makeNeonStrip(-ROOM_W/2 + 0.05, 0.1, -6, 4, 0, 0xaaccff);
  makeNeonStrip(-ROOM_W/2 + 0.05, 0.1,  6, 4, 0, 0xaaccff);
  makeNeonStrip( ROOM_W/2 - 0.05, 0.1, -6, 4, 0, 0xaaccff);
  makeNeonStrip( ROOM_W/2 - 0.05, 0.1,  6, 4, 0, 0xaaccff);

  // === PHOTOS N&B ===
  // 8 photos : 3 sur le mur du fond, 3 sur chaque mur latéral... non recalculons : 3 fond + 2 gauche + 2 droite + 1 = 8
  // Je préfère : 3 fond, 3 gauche, 2 droite (pour laisser place à la sortie côté droit du mur avant... non l'avant c'est devant)
  // Faisons : 2 fond + 3 gauche + 3 droite = 8
  const photoSlots = [
    // Mur du fond (-Z)
    { pos: [-3, 2.2, -ROOM_D/2 + 0.05], rot: [0, 0, 0] },
    { pos: [ 3, 2.2, -ROOM_D/2 + 0.05], rot: [0, 0, 0] },
    // Mur gauche
    { pos: [-ROOM_W/2 + 0.05, 2.2, -5], rot: [0, Math.PI/2, 0] },
    { pos: [-ROOM_W/2 + 0.05, 2.2,  0], rot: [0, Math.PI/2, 0] },
    { pos: [-ROOM_W/2 + 0.05, 2.2,  5], rot: [0, Math.PI/2, 0] },
    // Mur droit
    { pos: [ ROOM_W/2 - 0.05, 2.2, -5], rot: [0, -Math.PI/2, 0] },
    { pos: [ ROOM_W/2 - 0.05, 2.2,  0], rot: [0, -Math.PI/2, 0] },
    { pos: [ ROOM_W/2 - 0.05, 2.2,  5], rot: [0, -Math.PI/2, 0] },
  ];

  const photoMeshes = [];
  // Cadres très fins blancs/gris pour le N&B
  const frameMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.4 });

  photoSlots.forEach((slot, i) => {
    const data = PHOTOS_NB[i] || { src: '', titre: 'Photo ' + (i+1) };
    const group = new THREE.Group();
    const pw = 1.6, ph = 2.0;

    const frame = new THREE.Mesh(new THREE.BoxGeometry(pw + 0.08, ph + 0.08, 0.04), frameMat);
    group.add(frame);

    const photoMat = GalerieCommun.loadPhotoMaterial(data.src, i, {
      emissive: 0x111111,
      emissiveIntensity: 0.1
    });
    const photo = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), photoMat);
    photo.position.z = 0.025;
    photo.userData = { titre: data.titre };
    group.add(photo);
    photoMeshes.push(photo);

    group.position.set(...slot.pos);
    group.rotation.set(...slot.rot);
    scene.add(group);
  });

  // === BANC central (mobilier minimaliste) ===
  const benchMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.5 });
  const bench = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.4, 0.6), benchMat);
  bench.position.set(0, 0.2, 0);
  bench.castShadow = true;
  scene.add(bench);

  // === CONTRÔLES ===
  const ctrl = GalerieCommun.setupFPSControls(camera, renderer, {
    initialYaw: Math.PI, // regarde vers le fond de la salle au démarrage
    onLockChange: (locked) => {
      if (locked) startScreen.classList.add('hidden');
      else startScreen.classList.remove('hidden');
    }
  });

  startScreen.addEventListener('click', () => renderer.domElement.click());

  const checkHover = GalerieCommun.setupHoverDetection(camera, photoMeshes, titleOverlay);

  // === SORTIE : la porte avant ===
  const exitPos = new THREE.Vector3(0, 1.7, ROOM_D/2);
  function checkExit() {
    if (window._transitioning) return;
    const dist = camera.position.distanceTo(exitPos);
    if (dist < 1.8) {
      exitPrompt.style.opacity = '1';
      if (dist < 1.0) {
        window._transitioning = true;
        const fade = document.createElement('div');
        fade.style.cssText = 'position:fixed;inset:0;background:black;opacity:0;z-index:100;transition:opacity 0.5s';
        document.body.appendChild(fade);
        requestAnimationFrame(() => fade.style.opacity = '1');
        setTimeout(() => window.location.href = 'index.html', 550);
      }
    } else {
      exitPrompt.style.opacity = '0';
    }
  }

  function applyCollisions() {
    const m = 0.5;
    camera.position.x = Math.max(-ROOM_W/2 + m, Math.min(ROOM_W/2 - m, camera.position.x));
    // Permet de sortir par la porte (z+) si dans l'axe
    const atDoor = Math.abs(camera.position.x) < exitW/2;
    if (atDoor) {
      camera.position.z = Math.max(-ROOM_D/2 + m, Math.min(ROOM_D/2 + 1.5, camera.position.z));
    } else {
      camera.position.z = Math.max(-ROOM_D/2 + m, Math.min(ROOM_D/2 - m, camera.position.z));
    }
    camera.position.y = 1.7;
  }

  // === LOOP ===
  let lastTime = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    GalerieCommun.applyMovement(camera, ctrl, dt);
    applyCollisions();
    checkHover();
    checkExit();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
